name: Build & Release

# 在 GitHub 云端打包 Windows + macOS，并发布到 Release。
# 触发：推送 v* 标签（如 v0.1.0），或手动运行。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 允许创建/上传 Release 资产

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build & publish (Windows)
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build & publish (macOS)
        run: npm run build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
