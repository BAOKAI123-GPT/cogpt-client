appId: com.cogpt.app
productName: Co-GPT
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc,.prettierignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
asarUnpack:
  - '**/*.node'
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/@neplex/**
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  artifactName: Co-GPT-Setup-${version}.${ext}
portable:
  artifactName: Co-GPT-Portable-${version}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.graphics-design
  identity: null # 暂不做苹果签名（免费）
dmg:
  artifactName: Co-GPT-${version}-${arch}.${ext}
publish:
  provider: github
  owner: BAOKAI123-GPT
  repo: cogpt-client
